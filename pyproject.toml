[project]
name = "voxscribe"
version = "0.3.0"
description = "Audio transcription tool with web UI and hexagonal architecture"
authors = [{ name = "Pedro Balbino", email = "phsb5321@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
    # Transcription engines
    "faster-whisper>=1.1.0",
    "openai>=1.60.0",
    # Audio processing
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    # Background jobs
    "rq>=2.1.0",
    "redis>=5.0.0",
    # DNS
    "dnspython>=2.7.0",
    # Media download
    "yt-dlp>=2026.3.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "commitizen>=4.0.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["SIM115"]  # NamedTemporaryFile(delete=False) doesn't work well with context managers

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]
omit = ["app/adapters/outbound/engines/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.0"
tag_format = "v$version"
version_files = ["pyproject.toml:version"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
